<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Employee HR Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #006400;
            --bg: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #64748b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .portal-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 45px rgba(22, 163, 74, 0.12);
            text-align: center;
        }
        .logo-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(22, 163, 74, 0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .module-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .module-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
            background: #ffffff;
        }
        .module-card i {
            font-size: 24px;
            color: var(--primary);
        }
        .module-card span {
            font-size: 14px;
            font-weight: 600;
        }
        .primary-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 10px 20px rgba(22, 163, 74, 0.25);
            transition: opacity 0.2s;
        }
        .primary-action:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="logo-badge">
            <i class="fa-solid fa-users"></i>
        </div>
        <h1>Employee HR Management System</h1>
        <p class="subtitle">Complete HR Portal with integrated modules and interactive DOM JavaScript</p>

        <div class="modules-grid">
            <a href="login/index.html" class="module-card">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Login Portal</span>
            </a>
            <a href="dashboard/index.html" class="module-card">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            <a href="employees/index.html" class="module-card">
                <i class="fa-solid fa-users"></i>
                <span>Employees</span>
            </a>
            <a href="add-employee/index.html" class="module-card">
                <i class="fa-solid fa-user-plus"></i>
                <span>Add Employee</span>
            </a>
            <a href="attendance/index.html" class="module-card">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Attendance</span>
            </a>
            <a href="leave-management/index.html" class="module-card">
                <i class="fa-solid fa-plane-departure"></i>
                <span>Leaves</span>
            </a>
            <a href="payroll/index.html" class="module-card">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Payroll</span>
            </a>
            <a href="settings/index.html" class="module-card">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>

        <a href="login/index.html" class="primary-action" id="enterBtn">
            <span>Launch HRMS Portal</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <script>
        // Check if already authenticated, direct to dashboard or login
        window.addEventListener('DOMContentLoaded', () => {
            const isAuth = localStorage.getItem('HRMS_AUTH_TOKEN');
            if (isAuth) {
                window.location.href = 'dashboard/index.html';
            } else {
                // If direct visit to root, redirect to login after short delay or clicking
                setTimeout(() => {
                    window.location.href = 'login/index.html';
                }, 1200);
            }
        });
    </script>
</body>
</html>

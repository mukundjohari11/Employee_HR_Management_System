<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee - HRMS</title>

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ======================================
         SIDEBAR
    ======================================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <i class="fas fa-users"></i>
            </div>

            <h2>HRMS</h2>

            <span>Management System</span>

        </div>


        <div class="menu-title">
            MAIN MENU
        </div>


        <nav>

            <a href="../dashboard/index.html" class="menu-link">
                <i class="fas fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>

            <a href="../employees/index.html" class="menu-link">
                <i class="fas fa-users"></i>
                <span>Employees</span>
            </a>

            <a href="index.html" class="menu-link active">
                <i class="fas fa-user-plus"></i>
                <span>Add Employee</span>
            </a>

            <a href="../attendance/index.html" class="menu-link">
                <i class="fas fa-calendar-check"></i>
                <span>Attendance</span>
            </a>

            <a href="../leave-management/index.html" class="menu-link">
                <i class="fas fa-plane-departure"></i>
                <span>Leave Management</span>
            </a>

            <a href="../payroll/index.html" class="menu-link">
                <i class="fas fa-money-bill-wave"></i>
                <span>Payroll</span>
            </a>

            <a href="../settings/index.html" class="menu-link">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="admin-profile">

                <div class="avatar">
                    A
                </div>

                <div class="admin-info">
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>

                <i class="fas fa-ellipsis-h"></i>

            </div>


            <a href="../login%20page/index.html" class="logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>

        </div>

    </aside>



    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <main class="main">


        <header class="topbar">

            <div class="welcome">

                <h1>Add Employee</h1>

                <p>
                    Fill in the details below to onboard a new employee.
                </p>

            </div>


            <div class="top-actions">

                <a href="../employees/index.html" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Back to Employees
                </a>

            </div>

        </header>



        <!-- ======================================
             FORM
        ======================================= -->

        <form class="form-card">


            <!-- PHOTO -->

            <div class="form-section">

                <div class="photo-upload">

                    <div class="photo-circle">
                        <i class="fas fa-user"></i>
                    </div>

                    <label class="upload-btn">
                        <i class="fas fa-camera"></i>
                        Upload Photo
                        <input type="file" hidden>
                    </label>

                </div>

            </div>


            <!-- PERSONAL INFO -->

            <div class="form-section">

                <h2><i class="fas fa-id-card"></i> Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select>
                            <option>Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+91 00000 00000">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="employee@hrms.com">
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <input type="text" placeholder="Street, City, State, PIN">
                    </div>

                </div>

            </div>


            <!-- JOB INFO -->

            <div class="form-section">

                <h2><i class="fas fa-briefcase"></i> Job Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" placeholder="EMP00129" disabled>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select>
                            <option>Select department</option>
                            <option>Technology</option>
                            <option>Human Resources</option>
                            <option>Finance</option>
                            <option>Marketing</option>
                            <option>Operations</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Position</label>
                        <input type="text" placeholder="e.g. Software Developer">
                    </div>

                    <div class="form-group">
                        <label>Employment Type</label>
                        <select>
                            <option>Full-time</option>
                            <option>Part-time</option>
                            <option>Contract</option>
                            <option>Intern</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Joining Date</label>
                        <input type="date">
                    </div>

                    <div class="form-group">
                        <label>Reporting Manager</label>
                        <input type="text" placeholder="e.g. Priya Singh">
                    </div>

                </div>

            </div>


            <!-- SALARY INFO -->

            <div class="form-section">

                <h2><i class="fas fa-money-bill-wave"></i> Salary Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Basic Salary (₹)</label>
                        <input type="number" placeholder="e.g. 45000">
                    </div>

                    <div class="form-group">
                        <label>Allowances (₹)</label>
                        <input type="number" placeholder="e.g. 8000">
                    </div>

                    <div class="form-group">
                        <label>Pay Cycle</label>
                        <select>
                            <option>Monthly</option>
                            <option>Bi-weekly</option>
                            <option>Weekly</option>
                        </select>
                    </div>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="form-actions">

                <button type="reset" class="btn-secondary">Cancel</button>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-check"></i>
                    Save Employee
                </button>

            </div>

        </form>


    </main>

</body>

</html>

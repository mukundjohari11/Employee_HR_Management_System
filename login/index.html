<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="login-box">

        <div class="logo">
            <i class="fa-solid fa-users"></i>
        </div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your HR Management System</p>

        <!-- Demo Credentials Pill -->
        <div class="demo-badge" id="autofillDemo">
            <i class="fa-solid fa-key"></i>
            <span>Demo: <strong>admin@hrms.com</strong> / <strong>admin123</strong> (Click to autofill)</span>
        </div>

        <form id="loginForm" novalidate>

            <label for="emailInput">Email Address</label>
            <div class="input-box" id="emailBox">
                <span><i class="fa-regular fa-envelope"></i></span>
                <input type="email" id="emailInput" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="field-error" id="emailError"></div>

            <label for="passwordInput">Password</label>
            <div class="input-box" id="passwordBox">
                <span><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="passwordInput" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="eye-btn" id="togglePassword" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye" id="eyeIcon"></i>
                </button>
            </div>
            <div class="field-error" id="passwordError"></div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Login to HRMS</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

    </div>


    <!-- Right Side -->
    <div class="illustration">

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>

        <!-- Doodle -->
        <div class="doodle">

            <div class="person person1">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="person person2">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="laptop">
                <div class="screen"></div>
                <div class="base"></div>
            </div>

            <div class="plant">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
                <div class="pot"></div>
            </div>

        </div>

        <h2>Manage People.<br>Manage Success.</h2>
        <p>Everything you need to manage your workforce in one place.</p>

    </div>

</div>

<script src="../shared/js/hrms-store.js"></script>
<script src="script.js"></script>
</body>
</html>

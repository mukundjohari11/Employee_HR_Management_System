<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="login-box">

        <div class="logo">HR</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your HR Management System</p>

        <form>

            <label>Email Address</label>
            <div class="input-box">
                <span>✉</span>
                <input type="email" placeholder="Enter your email">
            </div>

            <label>Password</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

    </div>


    <!-- Right Side -->
    <div class="illustration">

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>

        <!-- Doodle -->
        <div class="doodle">

            <div class="person person1">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="person person2">
                <div class="head"></div>
                <div class="body"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <div class="laptop">
                <div class="screen"></div>
                <div class="base"></div>
            </div>

            <div class="plant">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
                <div class="pot"></div>
            </div>

        </div>

        <h2>Manage People.<br>Manage Success.</h2>
        <p>Everything you need to manage your workforce in one place.</p>

    </div>

</div>

</body>
</html>
